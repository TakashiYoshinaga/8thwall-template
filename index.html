<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>WebAR Image Tracking</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100dvh;
    }

    #status {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status">ARを起動中...</div>

  <!-- "slam" is the compatibility name that loads the local xr-tracking.js chunk. -->
  <script src="external/xr/xr.js" async data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

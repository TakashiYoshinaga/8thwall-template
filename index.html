<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Image Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <video id="video" playsinline style="display:none;"></video>
  <div id="status">ターゲット画像を探しています...</div>

  <!-- 8th Wall エンジン（async が必須、slam チャンクで XrController と画像トラッキングが有効になる） -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- Three.js r128 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <!-- AR アプリ本体 -->
  <script src="js/app.js"></script>
</body>
</html>
